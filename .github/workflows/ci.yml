name: PostgreSQL tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: canteen_test
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: canteen_inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canteen_test -d canteen_inventory_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://canteen_test:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/canteen_inventory
      TEST_DATABASE_URL: postgresql+psycopg://canteen_test:${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/canteen_inventory_test
      CANTEEN_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Create separate application database
        run: |
          python - <<'PY'
          import os
          import psycopg
          from sqlalchemy.engine import make_url
          url = make_url(os.environ['TEST_DATABASE_URL']).set(drivername='postgresql')
          with psycopg.connect(url.render_as_string(hide_password=False), autocommit=True) as connection:
              connection.execute('CREATE DATABASE canteen_inventory')
          PY
      - run: python -m alembic upgrade head
      - run: python -m pytest -q
