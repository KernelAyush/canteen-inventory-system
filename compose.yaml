services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: canteen_user
      POSTGRES_DB: canteen_inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - canteen_pg_data:/var/lib/postgresql/data
      - ./scripts/create_test_database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  canteen_pg_data:
